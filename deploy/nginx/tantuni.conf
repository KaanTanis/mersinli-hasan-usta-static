# ============================================
# MERSINLIHASANUSTATANTUNI.COM — Static site (HTML)
# SSL: Cloudflare (HTTP to origin)
# Rate Limit Tier: 1 (Normal)
#
# Cache: agresif edge (s-maxage=1y). Deploy sonrası Cloudflare → Purge Everything.
# Tarayıcı HTML TTL kısa (max-age=300) — purge unutulsa bile en fazla ~5 dk eski HTML.
# ============================================

server {
    listen 80;
    listen [::]:80;

    server_name mersinlihasanustatantuni.com www.mersinlihasanustatantuni.com;
    root /var/www/tantuni;

    index index.html;
    charset utf-8;

    include /etc/nginx/snippets/cloudflare-realip.conf;

    limit_conn connlimit 30;

    if ($bad_bot) { return 403; }
    if ($bad_method) { return 405; }
    if ($bad_uri) { return 444; }

    open_file_cache          max=2000 inactive=60s;
    open_file_cache_valid    120s;
    open_file_cache_min_uses 2;
    open_file_cache_errors   on;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml
        image/svg+xml;

    location = /index.html {
        limit_req zone=global burst=50 nodelay;
        add_header Cache-Control "public, max-age=300, s-maxage=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        etag on;
    }

    location = /robots.txt {
        add_header Cache-Control "public, max-age=86400, s-maxage=31536000" always;
        try_files $uri =404;
        access_log off;
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600, s-maxage=31536000" always;
        try_files $uri =404;
        access_log off;
    }
    location = /llms.txt {
        add_header Cache-Control "public, max-age=3600, s-maxage=31536000" always;
        default_type text/plain;
        charset utf-8;
        try_files $uri =404;
        access_log off;
    }

    location = /index.md {
        add_header Cache-Control "public, max-age=3600, s-maxage=31536000" always;
        default_type text/markdown;
        charset utf-8;
        try_files $uri =404;
        access_log off;
    }

    location = /.well-known/ai-catalog.json {
        add_header Cache-Control "public, max-age=3600, s-maxage=31536000" always;
        add_header Content-Type "application/ai-catalog+json; charset=utf-8" always;
        try_files $uri =404;
        access_log off;
    }

    location ^~ /assets/ {
        limit_req zone=global burst=100 nodelay;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ~* \.(webp|png|jpg|jpeg|gif|ico|svg|woff2|css|js|map)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    location ~ ^/(et-tantuni|biftek-tantuni|tavuk-tantuni)/index\.html$ {
        limit_req zone=global burst=50 nodelay;
        add_header Cache-Control "public, max-age=300, s-maxage=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        etag on;
    }

    location ~ ^/(et-tantuni|biftek-tantuni|tavuk-tantuni)/?$ {
        limit_req zone=global burst=50 nodelay;
        add_header Cache-Control "public, max-age=300, s-maxage=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /$1/index.html;
    }

    location / {
        limit_req zone=global burst=50 nodelay;
        add_header Cache-Control "public, max-age=300, s-maxage=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    location ~ \.php$ {
        return 444;
    }

    error_page 404 = @notfound;
    location @notfound {
        return 404;
    }

    access_log /var/log/nginx/tantuni-access.log main;
    error_log  /var/log/nginx/tantuni-error.log warn;
}
